# 网站上手动发 Release 时走这条；CI 打的 tag 由 build.yml 在创建 Release 后直接推 Discord
#（GITHUB_TOKEN 创建的 Release 不会触发本文件的 release 事件）。
# 在仓库 Settings → Secrets and variables → Actions 里添加 DISCORD_WEBHOOK，
# 值为 Discord 频道 Webhook 网址（不要在末尾加 /github）。
# 标签说明用中文，空一行后写 ## English 再写英文，Discord 会做成中英双语。
# 漏发时：Actions → Discord release → Run workflow，填 tag（如 v2.2.0）。
name: Discord release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要通报的 Release 标签
        required: true
        default: v2.2.0

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Post release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/post-discord-release.mjs
