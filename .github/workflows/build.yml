# 每次推送都在 Windows、macOS 和 Linux 上打包并自检；推送 v* 标签时自动发布 Release（启动器的自动更新从这里下载）。
#   发布新版本：改 src/Directory.Build.props 里的 Version，提交后
#   git tag -a v2.0.1 -m "更新内容..." && git push origin v2.0.1
#   标签说明会作为更新说明显示在启动器的更新提示里。
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SMOKE_VERSION: "1.21.1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-Xml -Path src/Directory.Build.props -XPath "//Version").Node.InnerText
          if ("v$version" -ne "${{ github.ref_name }}") { throw "标签 ${{ github.ref_name }} 与 Directory.Build.props 中的版本 $version 不一致" }

      - name: Publish
        shell: pwsh
        run: ./publish.ps1

      - name: Smoke test
        shell: pwsh
        timeout-minutes: 20
        run: |
          $env:MAOX_HOME = "$env:RUNNER_TEMP\maox-home"
          $out = "$env:RUNNER_TEMP\smoke-windows"
          $p = Start-Process -FilePath "dist\MaoX Launcher.exe" -ArgumentList "--smoke-test", "`"$out`"", "--launch", "$env:SMOKE_VERSION" -PassThru -Wait
          Get-Content "$out\report.txt" -ErrorAction SilentlyContinue
          exit $p.ExitCode

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-windows
          path: ${{ runner.temp }}/smoke-windows

      - name: Rename
        shell: pwsh
        run: Copy-Item "dist\MaoX Launcher.exe" "dist\MaoX-Launcher-Windows-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: MaoX-Windows
          path: dist/MaoX-Launcher-Windows-x64.exe

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: bash ./publish.sh

      - name: Verify bundles
        run: |
          for rid in osx-arm64 osx-x64; do
            app="dist/$rid/MaoX Launcher.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            file "$app/Contents/MacOS/MaoXLauncher"
            plutil -lint "$app/Contents/Info.plist"
          done

      - name: Smoke test (Apple Silicon)
        timeout-minutes: 20
        run: |
          export MAOX_HOME="$RUNNER_TEMP/maox-home"
          out="$RUNNER_TEMP/smoke-macos"
          code=0
          "dist/osx-arm64/MaoX Launcher.app/Contents/MacOS/MaoXLauncher" --smoke-test "$out" --launch "$SMOKE_VERSION" || code=$?
          cat "$out/report.txt" || true
          exit $code

      - name: Smoke test (Intel, Rosetta)
        continue-on-error: true
        timeout-minutes: 17
        run: |
          export MAOX_HOME="$RUNNER_TEMP/maox-home-x64"
          out="$RUNNER_TEMP/smoke-macos/x64"
          code=0
          arch -x86_64 "dist/osx-x64/MaoX Launcher.app/Contents/MacOS/MaoXLauncher" --smoke-test "$out" || code=$?
          cat "$out/report.txt" || true
          exit $code

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-macos
          path: ${{ runner.temp }}/smoke-macos

      - uses: actions/upload-artifact@v7
        with:
          name: MaoX-macOS
          path: dist/MaoX-Launcher-macOS-*.zip

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install UI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1 libx11-6 libxrandr2 \
            libxi6 libxcursor1 libxinerama1 libxkbcommon0 libgl1

      - name: Publish
        run: bash ./publish-linux.sh

      - name: Smoke test
        timeout-minutes: 15
        run: |
          export MAOX_HOME="$RUNNER_TEMP/maox-home"
          out="$RUNNER_TEMP/smoke-linux"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            dist/MaoX-Launcher-Linux-x64 --smoke-test "$out" || code=$?
          cat "$out/report.txt" || true
          exit ${code:-0}

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-linux
          path: ${{ runner.temp }}/smoke-linux

      - uses: actions/upload-artifact@v7
        with:
          name: MaoX-Linux
          path: dist/MaoX-Launcher-Linux-*

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android workload
        run: |
          dotnet workload install android
          dotnet build src/MaoX.Android/MaoX.Android.csproj -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True

      # 签名密钥存在仓库 Secrets 里；所有版本必须用同一个密钥签名，手机上才能覆盖安装更新
      - name: Publish APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maox.keystore"
            signing=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/maox.keystore"
                     -p:AndroidSigningKeyAlias=maox -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD
                     -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD)
          fi
          dotnet publish src/MaoX.Android/MaoX.Android.csproj -c Release -f net10.0-android -nologo \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -o out/android "${signing[@]}"
          mkdir -p dist
          cp out/android/*-Signed.apk dist/MaoX-Launcher-Android.apk
          rm -f "$RUNNER_TEMP/maox.keystore"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: MaoX-Android
          path: dist/MaoX-Launcher-Android.apk

  # 陶瓦联机没有 iOS 版：用官方源码打补丁编译成 iOS 动态库（见 src/MaoX.iOS/Terracotta），失败时 IPA 照常打包，只是不带联机
  ios-terracotta:
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # 编好的库按源码和补丁缓存：没改动时直接用，不再花十多分钟重新编译
      - name: Cache Terracotta library
        id: terracotta-lib
        uses: actions/cache@v5
        with:
          path: dist/terracotta
          key: ios-terracotta-lib-${{ hashFiles('src/MaoX.iOS/Terracotta/**') }}

      - name: Cache Rust build
        if: steps.terracotta-lib.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/terracotta-target
          key: ios-terracotta-${{ hashFiles('src/MaoX.iOS/Terracotta/**') }}
          restore-keys: ios-terracotta-

      # EasyTier 编译时要用 protoc 生成代码
      - name: Install protoc
        if: steps.terracotta-lib.outputs.cache-hit != 'true'
        run: brew install protobuf

      - name: Build Terracotta for iOS
        if: steps.terracotta-lib.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/terracotta-target
        run: bash src/MaoX.iOS/Terracotta/build.sh dist/terracotta

      - uses: actions/upload-artifact@v7
        with:
          name: terracotta-ios
          path: dist/terracotta/libterracotta.dylib

  # 内置 JIT（实验）：JIT 助手扩展 + StikJIT 1.9.0（MPL-2.0，版本固定在 src/MaoX.iOS/JITHelper/build.sh），
  # 只打进单独的实验版 IPA；失败时正式 IPA 照常打包
  ios-jit-helper:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # 和打包 IPA 用同一个 Xcode，不为 StikJIT 升级工具链
      - name: Select Xcode
        run: |
          xcode=/Applications/Xcode_26.5.app
          [ -d "$xcode" ] || xcode=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          xcode=$(cd "$xcode" && pwd -P)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Build JIT helper
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Directory.Build.props | head -1)
          bash src/MaoX.iOS/JITHelper/build.sh dist/jithelper io.github.jinruimaomao.maox "$version"

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/pairing-target
          key: ios-pairing-${{ hashFiles('src/MaoX.iOS/Pairing/**') }}
          restore-keys: ios-pairing-

      # iOS 27+ 在本机生成配对文件（idevice，MIT，版本固定在 src/MaoX.iOS/Pairing/Cargo.toml）；失败时实验版 IPA 只是没有这个功能
      - name: Build pairing library
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pairing-target
        run: bash src/MaoX.iOS/Pairing/build.sh dist/jithelper

      - uses: actions/upload-artifact@v7
        with:
          name: jit-helper-ios
          path: dist/jithelper

  ios:
    needs: [ios-terracotta, ios-jit-helper]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # .NET for iOS 的每个版本只认对应的 Xcode：工作负载固定在 10.0.401（iOS 26.5），Xcode 选 26.5
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=/Applications/Xcode_26.5.app
          [ -d "$xcode" ] || xcode=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          xcode=$(cd "$xcode" && pwd -P)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.401

      # Temurin 没有 Apple 芯片的 Java 8
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"

      - name: Cache iOS JREs
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/jre-cache
          key: ios-jre-v1

      # 游戏运行环境：移动版 Java、LWJGL、ANGLE / gl4es 来自 Amethyst-iOS（GPL-3.0），启动层源码在 src/MaoX.iOS/Native 和 Java
      - name: Build game runtime
        env:
          AMETHYST_COMMIT: f98c4133c72d39e06ceac42b57cc4477c52105fc
        run: |
          work="$RUNNER_TEMP/game"
          rt="$work/runtime"
          mkdir -p "$rt/Frameworks" "$rt/libs" "$rt/libs_caciocavallo" "$rt/libs_caciocavallo17" "$rt/java_runtimes"
          curl -fsSL --retry 3 "https://github.com/AngelAuraMC/Amethyst-iOS/archive/$AMETHYST_COMMIT.tar.gz" | tar xz -C "$work"
          ame="$work/Amethyst-iOS-$AMETHYST_COMMIT"
          fw="$ame/Natives/resources/Frameworks"

          bash src/MaoX.iOS/Native/build.sh "$fw" "$work/native"
          # JLI 用 dlsym(RTLD_DEFAULT, "main") 重新进入 JLI_Launch，.NET 主程序不导出 main
          nm -gU "$work/native/libmaoxgame.dylib" | grep -q " _main$"
          bash src/MaoX.iOS/Java/build.sh "$ame/JavaApp/libs" "$rt/libs"

          cp -R "$fw/libEGL.framework" "$fw/libGLESv2.framework" "$rt/Frameworks/"
          for lib in libgl4es_114 liblwjgl liblwjgl_nanovg liblwjgl_opengl liblwjgl_stb liblwjgl_tinyfd liblwjgl_vma \
                     libopenal libfreetype libMoltenVK libshaderc; do
            cp "$fw/$lib.dylib" "$rt/Frameworks/"
          done
          cp "$work/native/libmaoxgame.dylib" "$work/native/libtinygl4angle.dylib" "$rt/Frameworks/"
          cp "$ame/JavaApp/libs/caciocavallo/"*.jar "$rt/libs_caciocavallo/"
          cp "$ame/JavaApp/libs/caciocavallo17/"*.jar "$rt/libs_caciocavallo17/"
          cp "$ame/Natives/resources/UniversalJIT26.js" "$ame/Natives/resources/UniversalJIT26Extension.js" "$rt/"

          cache="$RUNNER_TEMP/jre-cache"
          mkdir -p "$cache"
          for v in 8 17 21 25; do
            zip="$cache/jre$v.zip"
            [ -s "$zip" ] || curl -fsSL --retry 3 -o "$zip" "https://assets.angelauramc.dev/openjdk/ios-arm64/jre$v-ios-aarch64.zip"
            unzip -q -o "$zip" -d "$work/jre$v"
            dir="$rt/java_runtimes/java-$v-openjdk"
            mkdir -p "$dir"
            tar xf "$(ls "$work/jre$v"/*.tar.xz | head -1)" -C "$dir"
            (cd "$dir" && rm -rf ASSEMBLY_EXCEPTION bin include jre legal LICENSE man THIRD_PARTY_README \
                                 lib/ct.sym lib/jspawnhelper lib/libjsig.dylib lib/src.zip lib/tools.jar)
            test -f "$dir/release"
            cp "$work/native/libawt_xawt.dylib" "$dir/lib/"
          done

          du -sh "$rt"/* "$rt"/java_runtimes/*
          echo "GAME_RUNTIME=$rt" >> "$GITHUB_ENV"

      - name: Add Terracotta
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: terracotta-ios
          path: ${{ env.GAME_RUNTIME }}/Frameworks

      # 没有苹果开发者证书：打包未签名的 IPA，由用户用 AltStore / SideStore / TrollStore 等工具签名安装
      # 主程序带上 JIT 和大内存需要的权限，SideStore 签名时会照着申请
      - name: Build IPA
        run: |
          dotnet build src/MaoX.iOS/MaoX.iOS.csproj -c Release -f net10.0-ios -r ios-arm64 -nologo \
            -p:EnableCodeSigning=false -p:ValidateXcodeVersion=false
          app=$(find src/MaoX.iOS/bin/Release -maxdepth 4 -type d -name "*.app" | head -1)
          echo "App bundle: $app"
          mkdir -p dist/ipa/Payload
          cp -R "$app" dist/ipa/Payload/
          app="dist/ipa/Payload/$(basename "$app")"
          cp -R "$GAME_RUNTIME/." "$app/"
          exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Info.plist")
          codesign --force --sign - --entitlements src/MaoX.iOS/Entitlements.sideload.plist --generate-entitlement-der "$app/$exe"
          codesign -d --entitlements - "$app/$exe"
          test ! -e "$app/PlugIns"
          (cd dist/ipa && zip -qry ../MaoX-Launcher-iOS.ipa Payload)
          rm -rf dist/ipa
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: MaoX-iOS
          path: dist/MaoX-Launcher-iOS.ipa

      - name: Download JIT helper
        id: jithelper
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: jit-helper-ios
          path: ${{ runner.temp }}/jithelper

      # 实验版：正式 IPA 加上 PlugIns/MaoXJITHelper.appex 和 Frameworks/StikJIT.framework，不进 Release、不参与自动更新
      - name: Build IPA with built-in JIT (experimental)
        if: steps.jithelper.outcome == 'success'
        run: |
          helper="$RUNNER_TEMP/jithelper"
          echo "StikJIT: $(cat "$helper/stikjit-origin.txt")"
          app=$(find src/MaoX.iOS/bin/Release -maxdepth 4 -type d -name "*.app" | head -1)
          mkdir -p dist/ipa-jit/Payload
          cp -R "$app" dist/ipa-jit/Payload/
          app="dist/ipa-jit/Payload/$(basename "$app")"
          cp -R "$GAME_RUNTIME/." "$app/"
          mkdir -p "$app/PlugIns"
          cp -R "$helper/MaoXJITHelper.appex" "$app/PlugIns/"
          cp -R "$helper/StikJIT.framework" "$app/Frameworks/"
          chmod +x "$app/PlugIns/MaoXJITHelper.appex/MaoXJITHelper" "$app/Frameworks/StikJIT.framework/StikJIT"
          if [ -f "$helper/libmaoxpair.dylib" ]; then
            cp "$helper/libmaoxpair.dylib" "$app/Frameworks/"
            codesign --force --sign - "$app/Frameworks/libmaoxpair.dylib"
            nm -gU "$app/Frameworks/libmaoxpair.dylib" | grep -q _maox_pair_run
          else
            echo "::warning::Pairing library was not built; the experimental IPA cannot generate pairing files on device"
          fi

          # 由内向外签名：框架、扩展、主程序（用户的安装工具会用自己的证书全部重签）
          exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Info.plist")
          codesign --force --sign - "$app/Frameworks/StikJIT.framework"
          codesign --force --sign - --generate-entitlement-der "$app/PlugIns/MaoXJITHelper.appex"
          codesign --force --sign - --entitlements src/MaoX.iOS/Entitlements.sideload.plist --generate-entitlement-der "$app/$exe"

          # 检查签名和打包关系
          codesign --verify --strict --verbose=2 "$app/Frameworks/StikJIT.framework"
          codesign --verify --strict --verbose=2 "$app/PlugIns/MaoXJITHelper.appex"
          codesign --verify --strict --verbose=2 "$app/$exe"
          codesign --verify --deep --strict --verbose=2 "$app" || echo "::warning::Deep verification of the whole app failed (the standard IPA is signed the same way)"
          codesign -d --entitlements - "$app/$exe" 2>&1 | grep -q get-task-allow
          app_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          helper_plist="$app/PlugIns/MaoXJITHelper.appex/Info.plist"
          helper_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$helper_plist")
          echo "App $app_id, helper $helper_id"
          case "$helper_id" in "$app_id".*) ;; *) echo "Helper identifier must start with $app_id."; exit 1 ;; esac
          [ "$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPrincipalClass" "$helper_plist")" = MaoXJITHelperHandler ]
          [ "$(/usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$helper_plist")" = "XPC!" ]
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Frameworks/StikJIT.framework/Info.plist"
          otool -L "$app/PlugIns/MaoXJITHelper.appex/MaoXJITHelper" | grep -q "@rpath/StikJIT.framework/StikJIT"
          test -f "$app/PlugIns/MaoXJITHelper.appex/../../Frameworks/StikJIT.framework/StikJIT"
          test -f "$app/Frameworks/StikJIT.framework/LICENSE.StikJIT-MPL-2.0.txt"
          nm -gU "$app/Frameworks/libmaoxgame.dylib" | grep -q _maox_jit_helper_request
          nm -gU "$app/Frameworks/libmaoxgame.dylib" | grep -q _maox_pair_start
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" "$app/Info.plist" | grep -q _remotepairing-pairable-host._tcp
          (cd dist/ipa-jit && zip -qry ../MaoX-Launcher-iOS-BuiltinJIT.ipa Payload)
          rm -rf dist/ipa-jit
          ls -la dist

      - uses: actions/upload-artifact@v7
        if: steps.jithelper.outcome == 'success'
        with:
          name: ios-builtin-jit-experimental
          path: dist/MaoX-Launcher-iOS-BuiltinJIT.ipa

      - name: Simulator smoke test
        timeout-minutes: 25
        run: |
          dotnet build src/MaoX.iOS/MaoX.iOS.csproj -c Debug -f net10.0-ios -r iossimulator-arm64 -nologo \
            -p:ValidateXcodeVersion=false
          app=$(find src/MaoX.iOS/bin/Debug -maxdepth 4 -type d -name "*.app" | head -1)
          out="$RUNNER_TEMP/smoke-ios"
          mkdir -p "$out"
          code=0
          for kind in iPhone iPad; do
            udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if '.iOS-' in k), key=lambda k: [int(p) for p in k.split('iOS-')[1].split('-')])
          print(next(d['udid'] for d in devices[runtimes[-1]] if d['name'].startswith('$kind')))")
            echo "== $kind $udid"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$app"
            xcrun simctl launch "$udid" io.github.jinruimaomao.maox
            sleep 45
            xcrun simctl io "$udid" screenshot "$out/$kind.png"
            data=$(xcrun simctl get_app_container "$udid" io.github.jinruimaomao.maox data)
            cp "$data/Documents/launcher_crash.log" "$out/$kind-crash.log" 2>/dev/null || true
            if ! xcrun simctl spawn "$udid" launchctl list | grep -q "io.github.jinruimaomao.maox"; then
              echo "$kind: app is not running"
              code=1
            fi
            xcrun simctl shutdown "$udid"
          done
          ls -la "$out"
          exit $code

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-ios
          path: ${{ runner.temp }}/smoke-ios

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: MaoX-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          if [ ! -s notes.md ]; then echo "MaoX Launcher $GITHUB_REF_NAME" > notes.md; fi
          cat >> notes.md <<'EOF'

          ---
          **下载**：Windows 下载 `MaoX-Launcher-Windows-x64.exe`；Mac（M 系列芯片）下载 `MaoX-Launcher-macOS-arm64.zip`，Intel 芯片下载 `MaoX-Launcher-macOS-x64.zip`。
          Linux 下载 `MaoX-Launcher-Linux-x64` 或 `MaoX-Launcher-Linux-arm64`，赋予执行权限后直接运行。数据目录在 `~/.local/share/MaoX Launcher`。
          Mac 首次打开如果提示无法验证开发者：右键点击 → 打开，或到"系统设置 → 隐私与安全性"点"仍要打开"。需要 macOS 14 或更高版本。
          安卓手机/平板下载 `MaoX-Launcher-Android.apk` 直接安装（需要 Android 8.0 或更高版本，64 位）。
          iPhone/iPad 下载 `MaoX-Launcher-iOS.ipa`，用 SideStore / AltStore / TrollStore 安装（需要 iOS 15 或更高版本）；启动游戏需要 JIT：iOS 17.4 以上装 StikDebug，启动器会自动请求开启。Forge / NeoForge / OptiFine 请在电脑上安装好再把版本文件夹复制到手机。
          EOF
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "MaoX Launcher $GITHUB_REF_NAME" --notes-file notes.md
